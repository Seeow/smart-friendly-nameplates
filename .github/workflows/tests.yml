name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lua:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
      - name: Check Lua syntax
        run: luac5.1 -p SmartFriendlyNameplates/*.lua
      - name: Run integration checks
        run: lua5.1 tests/test_addon.lua
      - name: Build installable archive
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            ./scripts/package.ps1 -Tag $env:GITHUB_REF_NAME
          } else {
            ./scripts/package.ps1
          }
      - name: Get reference packager
        uses: actions/checkout@v7
        with:
          repository: BigWigsMods/packager
          ref: 01e8631a69c69d7654c788d152630d5fed9e3812 # v2
          path: .tools/curseforge-packager
          persist-credentials: false
      - name: Dry-run CurseForge-compatible packaging
        shell: bash
        # Validate even when a branch push points at an already tagged commit.
        # The upstream action otherwise skips that duplicate build entirely.
        run: env -u GITHUB_EVENT_NAME bash .tools/curseforge-packager/release.sh -d -e -l -z
      - name: Verify CurseForge package layout
        shell: pwsh
        run: ./scripts/check-curseforge-package.ps1
